services:
  - type: web
    name: math-tracker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /data/clicks.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
