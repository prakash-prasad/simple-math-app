<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Tracker</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/overlay.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <span class="brand">🧮 Math Tracker</span>
    <div class="user-info">
      Logged in as <strong id="user-display"></strong>
      <button class="analytics-toggle-btn" id="analytics-toggle-btn">Analytics</button>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <!-- Overlay control bar (hidden until Analytics is toggled on) -->
  <div class="overlay-controls" id="overlay-controls" style="display:none">
    <label for="overlay-user-select">Filter:</label>
    <select id="overlay-user-select">
      <option value="all">All Users</option>
    </select>
    <button class="overlay-refresh-btn" id="overlay-refresh-btn">Refresh</button>
    <div id="overlay-show-counts" class="overlay-show-counts"></div>
    <div class="overlay-legend">
      <span>Few</span>
      <div class="overlay-legend-bar"></div>
      <span>Many</span>
    </div>
  </div>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="addition">Addition</button>
    <button class="tab-btn" data-tab="subtraction">Subtraction</button>
    <button class="tab-btn" data-tab="multiplication">Multiplication</button>
  </nav>

  <!-- Panels -->
  <main class="tab-panels">

    <!-- Addition -->
    <section class="tab-panel active" id="panel-addition">
      <div class="math-card">
        <h2>Addition</h2>
        <div class="equation">
          <span class="num" id="num-a-addition">?</span>
          <span class="op-symbol">+</span>
          <span class="num" id="num-b-addition">?</span>
          <span class="equals">=</span>
          <span class="result-val" id="result-addition"></span>
        </div>
        <button class="btn-show" id="show-btn-addition">Show Result</button>
      </div>
    </section>

    <!-- Subtraction -->
    <section class="tab-panel" id="panel-subtraction">
      <div class="math-card">
        <h2>Subtraction</h2>
        <div class="equation">
          <span class="num" id="num-a-subtraction">?</span>
          <span class="op-symbol">−</span>
          <span class="num" id="num-b-subtraction">?</span>
          <span class="equals">=</span>
          <span class="result-val" id="result-subtraction"></span>
        </div>
        <button class="btn-show" id="show-btn-subtraction">Show Result</button>
      </div>
    </section>

    <!-- Multiplication -->
    <section class="tab-panel" id="panel-multiplication">
      <div class="math-card">
        <h2>Multiplication</h2>
        <div class="equation">
          <span class="num" id="num-a-multiplication">?</span>
          <span class="op-symbol">×</span>
          <span class="num" id="num-b-multiplication">?</span>
          <span class="equals">=</span>
          <span class="result-val" id="result-multiplication"></span>
        </div>
        <button class="btn-show" id="show-btn-multiplication">Show Result</button>
      </div>
    </section>

  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/tracker.js"></script>
  <script src="/js/overlay.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
